# Builds the downloads for Linux (AppImage), Windows (.exe) and macOS (.app, Apple silicon).
# - Every push / PR: tests + lint.
# - Manual run ("Run workflow"): also builds all three and keeps them as workflow artifacts.
# - Pushing a tag like v0.1.0: builds all three and attaches them to a GitHub Release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: ruff check claude_usage tests
      - run: python -m pytest -q

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04   # oldest supported glibc -> runs on more distros
            target: linux
          - os: windows-2022
            target: windows
          - os: macos-15       # Apple silicon
            target: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt

      - name: Read version (and check it matches the tag)
        shell: bash
        run: |
          VERSION=$(python -c "import claude_usage; print(claude_usage.__version__)")
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$VERSION" ]]; then
            echo "Tag ${GITHUB_REF#refs/tags/} does not match __version__ $VERSION" >&2; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean packaging/claude-usage-dial.spec

      # ---- Linux
      - name: Linux - build AppImage and self-test it
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          packaging/build_appimage.sh
          APPIMAGE_EXTRACT_AND_RUN=1 "dist/Claude-Usage-Dial-${VERSION}-x86_64.AppImage" --self-test
          echo "ASSET=dist/Claude-Usage-Dial-${VERSION}-x86_64.AppImage" >> "$GITHUB_ENV"

      # ---- Windows (GUI exe: wait for it explicitly and check the exit code)
      - name: Windows - self-test and name the exe
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $p = Start-Process dist\claude-usage-dial.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }
          $out = "dist\Claude-Usage-Dial-$env:VERSION-windows-x64.exe"
          Move-Item dist\claude-usage-dial.exe $out
          "ASSET=$out" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ---- macOS
      - name: macOS - self-test and zip the .app
        if: matrix.target == 'macos'
        run: |
          "dist/Claude Usage Dial.app/Contents/MacOS/claude-usage-dial" --self-test
          ditto -c -k --keepParent "dist/Claude Usage Dial.app" "dist/Claude-Usage-Dial-${VERSION}-macos-arm64.zip"
          echo "ASSET=dist/Claude-Usage-Dial-${VERSION}-macos-arm64.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # to create the Release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: assets, merge-multiple: true }
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: assets/*
          generate_release_notes: true
